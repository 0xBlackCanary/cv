<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currículum Vitae — Cybersecurity Professional</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    /* Paleta Matrix Atenuada: Protección ocular y alto contraste ciberpunk */
    --green: #33ff33;           /* Verde fósforo clásico equilibrado */
    --green-dim: #1a991a;       /* Verde atenuado para textos largos y párrafos */
    --green-dark: #004d00;      /* Verde militar oscuro para estructuras y bordes */
    --blue: #00a3cc;            /* Azul técnico suavizado */
    --blue-dim: #006680;        /* Azul atenuado */
    --fuchsia: #cc00cc;         /* Fucsia de control suavizado */
    --fuchsia-dim: #800080;     /* Fucsia oscuro */
    --bg: #0a0f0d;              /* Fondo oscuro profundo de terminal */
    --panel: #000000;           /* Fondo negro puro para bloques */
    --text: #1a991a;            /* Texto base en verde confortable */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    line-height: 1.7;
    padding: 0;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(51,255,51,0.015) 2px,
      rgba(51,255,51,0.015) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* HEADER */
  header {
    background: #000000;
    border-bottom: 2px solid var(--fuchsia);
    padding: 40px 40px 28px;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 300%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--fuchsia), var(--blue), var(--green), transparent);
    animation: scan 3s linear infinite;
  }

  @keyframes scan {
    0% { transform: translateX(-33%); }
    100% { transform: translateX(33%); }
  }

  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: end;
  }

  .header-badge {
    display: inline-block;
    border: 1px solid var(--fuchsia);
    color: var(--fuchsia);
    font-size: 10px;
    letter-spacing: 4px;
    padding: 3px 14px;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(20px, 3.5vw, 36px);
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 4px rgba(51, 255, 51, 0.4);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .header-title {
    color: var(--blue);
    font-size: 13px;
    letter-spacing: 3px;
    text-shadow: 0 0 4px rgba(0, 163, 204, 0.3);
  }

  .header-meta {
    text-align: right;
    font-size: 12px;
  }

  .header-meta .meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 4px;
    color: var(--blue);
  }

  .meta-dot {
    width: 6px; height: 6px;
    background: var(--fuchsia);
    display: inline-block;
  }

  .avail-badge {
    display: inline-block;
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 10px;
    letter-spacing: 2px;
    padding: 3px 10px;
    margin-top: 8px;
    text-shadow: 0 0 4px rgba(51, 255, 51, 0.3);
  }

  /* LAYOUT */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 40px;
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 30px;
  }

  @media (max-width: 768px) {
    .container {
      grid-template-columns: 1fr;
    }
    .header-inner {
      grid-template-columns: 1fr;
    }
    .header-meta {
      text-align: left;
    }
    .header-meta .meta-item {
      justify-content: flex-start;
    }
  }

  /* SECTION */
  .section {
    margin-bottom: 30px;
  }

  .section-title {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--fuchsia);
    text-shadow: 0 0 4px rgba(204, 0, 204, 0.4);
    letter-spacing: 3px;
    text-transform: uppercase;
    border-left: 3px solid var(--fuchsia);
    padding: 6px 0 6px 14px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, rgba(204,0,204,0.04) 0%, transparent 60%);
  }

  /* PERFIL */
  .perfil-box {
    background: var(--panel);
    border: 1px solid var(--blue);
    border-left: 3px solid var(--blue);
    padding: 16px 18px;
    color: var(--blue);
    font-size: 13px;
    line-height: 1.8;
    box-shadow: inset 0 0 12px rgba(0,163,255,0.02);
  }

  /* EXPERIENCIA */
  .exp-item {
    margin-bottom: 24px;
    padding-left: 16px;
    border-left: 2px solid var(--green-dark);
    position: relative;
  }

  .exp-item::before {
    content: '';
    position: absolute;
    left: -5px; top: 6px;
    width: 8px; height: 8px;
    background: var(--green);
    box-shadow: 0 0 4px var(--green);
  }

  .exp-company {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    color: var(--green);
    text-shadow: 0 0 4px rgba(51, 255, 51, 0.3);
    font-weight: 700;
    letter-spacing: 1px;
  }

  .exp-year {
    color: var(--fuchsia);
    font-size: 11px;
    letter-spacing: 2px;
    margin-left: 10px;
  }

  .exp-tasks {
    list-style: none;
    margin-top: 6px;
  }

  .exp-tasks li {
    color: var(--green-dim);
    font-size: 12px;
    padding: 3px 0;
    padding-left: 14px;
    position: relative;
  }

  .exp-tasks li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--fuchsia);
    font-size: 11px;
  }

  /* FORMACION */
  .form-item {
    background: var(--panel);
    border: 1px solid rgba(51, 255, 51, 0.05);
    border-left: 3px solid var(--green);
    padding: 12px 14px;
    margin-bottom: 12px;
  }

  .form-title {
    color: var(--green);
    font-size: 12px;
    line-height: 1.5;
    font-weight: bold;
  }

  .form-meta {
    color: var(--fuchsia);
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .form-highlight {
    display: inline-block;
    background: rgba(51,255,65,0.04);
    border: 1px solid var(--green-dim);
    color: var(--green);
    font-size: 10px;
    padding: 2px 8px;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* SIDEBAR */
  .sidebar .section {
    margin-bottom: 24px;
  }

  /* COMPETENCIAS */
  .skill-block {
    margin-bottom: 14px;
  }

  .skill-label {
    color: var(--blue);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
    text-shadow: 0 0 4px rgba(0, 163, 204, 0.3);
  }

  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    border: 1px solid var(--blue-dim);
    color: var(--blue);
    font-size: 10px;
    padding: 3px 9px;
    letter-spacing: 1px;
    background: var(--panel);
  }

  .tag.green {
    border-color: var(--green-dark);
    color: var(--green-dim);
  }

  .tag.fuchsia {
    border-color: var(--fuchsia-dim);
    color: var(--fuchsia);
  }

  /* SOFT SKILLS */
  .soft-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--green-dim);
  }

  .soft-icon {
    width: 14px; height: 14px;
    border: 1px solid var(--fuchsia-dim);
    flex-shrink: 0;
    margin-top: 2px;
    position: relative;
    background: var(--panel);
  }

  .soft-icon::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px; right: 2px; bottom: 2px;
    background: var(--fuchsia-dim);
  }

  /* IDIOMAS */
  .lang-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
  }

  .lang-name { color: var(--green-dim); }

  .lang-level {
    display: flex;
    gap: 4px;
  }

  .lang-dot {
    width: 8px; height: 8px;
    border: 1px solid var(--green-dark);
  }

  .lang-dot.filled { background: var(--green-dim); }

  /* DATOS */
  .dato-item {
    background: var(--panel);
    border: 1px solid rgba(51, 255, 51, 0.05);
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }

  .dato-label {
    color: var(--fuchsia);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .dato-value {
    color: var(--green-dim);
  }

  /* DIVIDER */
  .divider {
    border: none;
    border-top: 1px solid rgba(51, 255, 51, 0.05);
    margin: 24px 0;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 20px 40px;
    border-top: 1px solid rgba(51, 255, 51, 0.05);
    color: var(--green-dark);
    font-size: 11px;
    letter-spacing: 2px;
    background: #000000;
  }
</style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div>
        <div class="header-badge">SecOps Node Active</div>
        <h1>0xBlackCanary</h1>
        <div class="header-title">🛡 JUNIOR CYBERSECURITY · GESTIÓN DE DATOS · ADMINISTRACIÓN</div>
      </div>
      <div class="header-meta">
        <div class="meta-item"><span class="meta-dot"></span> Alicante, España</div>
        <div class="meta-item"><span class="meta-dot"></span> Core OS: Windows & Linux Environment</div>
        <div class="avail-badge">[ DISPONIBILIDAD INMEDIATA ]</div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="container">
    
    <!-- MAIN COLUMN -->
    <main>
      
      <!-- PERFIL -->
      <section class="section">
        <div class="section-title">[01] Perfil Profesional</div>
        <div class="perfil-box">
